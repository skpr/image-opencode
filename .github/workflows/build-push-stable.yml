name: Build and Push Stable

on:
  push:
    branches: [ releases ]
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode version to install (e.g. v1.17.0)'
        required: false
        default: v1.17.3
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC daily

jobs:
  build:
    uses: ./.github/workflows/build-push.yml
    with:
      stream: stable
      push: true
      opencode_version: ${{ inputs.opencode_version }}
    secrets: inherit
