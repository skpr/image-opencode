name: Build and Push

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-latest
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      stream:
        type: string
        default: latest
      version:
        type: string
        default: v1
      alpine:
        type: string
        default: '3.24'
      opencode_version:
        type: string
        default: latest
        description: opencode release tag to install (e.g. v1.17.0), or "latest"
      push:
        type: boolean
        default: false
    secrets:
      SKILLS_APP_CLIENT_ID:
        required: true
      SKILLS_APP_PRIVATE_KEY:
        required: true

jobs:
  build:
    name: Build Docker image
    runs-on: ${{ inputs.runs_on }}
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Generate skills repo token
        id: skills-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SKILLS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_APP_PRIVATE_KEY }}
          owner: previousnext
          repositories: skills
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Download and verify opencode binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$([ "$(uname -m)" = "aarch64" ] && echo "arm64" || echo "x64")
          gh release download "${{ inputs.opencode_version }}" \
            --repo anomalyco/opencode \
            --pattern "opencode-linux-${ARCH}-musl.tar.gz" \
            --output /tmp/opencode.tar.gz
          gh attestation verify /tmp/opencode.tar.gz \
            --repo anomalyco/opencode \
            --predicate-type https://in-toto.io/attestation/release/v0.2
          tar -xz -C . -f /tmp/opencode.tar.gz
      - name: Build and push Docker image
        uses: docker/bake-action@v7
        env:
          ALPINE_VERSION: ${{ inputs.alpine }}
          STREAM: ${{ inputs.stream }}
          VERSION: ${{ inputs.version }}
          SKILLS_TOKEN: ${{ steps.skills-token.outputs.token }}
        with:
          push: ${{ inputs.push }}
