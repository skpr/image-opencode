services:

  opencode:
    image: ghcr.io/skpr/opencode:v1-latest
    # Mount the project directory into the container workdir.
    volumes:
      - .:/data
    environment:
      # Pass your Anthropic API key at runtime. Never hard-code it here.
      # Add ANTHROPIC_API_KEY to a .env file (gitignored) or export it in your shell.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    # Required on Linux so that host.docker.internal resolves to the Docker host.
    # This allows the JetBrains MCP server to connect back to the IDE on the host.
    # Docker Desktop on macOS/Windows provides this automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Keep the container running so `docker compose exec opencode bash` works.
    command: sleep infinity
    stdin_open: true
    tty: true
