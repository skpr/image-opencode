schemaVersion: '2.0.0'

commandTests:
  - name: "opencode"
    command: "opencode"
    args: ["--version"]
    exitCode: 0

  - name: "git"
    command: "git"
    args: ["--version"]
    expectedOutput: ["git version"]
    exitCode: 0

  - name: "gh"
    command: "gh"
    args: ["--version"]
    expectedOutput: ["gh version"]
    exitCode: 0

  - name: "node"
    command: "node"
    args: ["--version"]
    expectedOutput: ["v"]
    exitCode: 0

  - name: "npm"
    command: "npm"
    args: ["--version"]
    exitCode: 0

  - name: "pnpm"
    command: "pnpm"
    args: ["--version"]
    exitCode: 0

  - name: "php"
    command: "php"
    args: ["--version"]
    expectedOutput: ["PHP 8.4"]
    exitCode: 0

  - name: "intelephense"
    command: "intelephense"
    args: ["--version"]
    exitCode: 0

  - name: "jq"
    command: "jq"
    args: ["--version"]
    expectedOutput: ["jq-"]
    exitCode: 0

  - name: "vim"
    command: "vim"
    args: ["--version"]
    expectedOutput: ["VIM"]
    exitCode: 0

  - name: "curl"
    command: "curl"
    args: ["--version"]
    expectedOutput: ["curl"]
    exitCode: 0

  - name: "make"
    command: "make"
    args: ["--version"]
    expectedOutput: ["GNU Make"]
    exitCode: 0

  - name: "rsync"
    command: "rsync"
    args: ["--version"]
    expectedOutput: ["rsync"]
    exitCode: 0

fileExistenceTests:
  - name: "opencode config"
    path: "/home/skpr/.config/opencode/config.json"
    shouldExist: true

  - name: "workdir /data"
    path: "/data"
    shouldExist: true

metadataTest:
  workdir: "/data"
  user: "skpr"
